name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version="$(bun -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - run: bun run lint
      - run: bun test
      - name: Smoke test under Bun
        run: bun scripts/smoke/daemon-boot.ts

  validate-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # node_modules comes from the bun lockfile so both runtimes resolve the
      # same dependency tree.
      - run: bun install --frozen-lockfile
      - run: deno task check
      - name: Smoke test under Deno
        run: deno task smoke

  build:
    needs: [validate, validate-deno]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            platform: darwin
            arch: x64
          - runner: macos-15
            target: bun-darwin-arm64
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - name: Build standalone executable
        run: >-
          bun build --compile
          --target=${{ matrix.target }}
          --no-compile-autoload-dotenv
          --no-compile-autoload-bunfig
          src/index.bun.ts
          --outfile=build/routstrd
      # Via the task so CI and `deno task compile` cannot drift apart. Deno's
      # compiler runs natively on each matrix runner, so there is no --target.
      - name: Build Deno standalone executable
        run: |
          deno task compile
          mkdir -p build-deno
          mv dist/routstrd-deno build-deno/routstrd
      - name: Smoke test executables
        run: |
          package_version="$(bun -p "require('./package.json').version")"
          for binary in build/routstrd build-deno/routstrd; do
            test "$("${binary}" --version)" = "${package_version}"
            "${binary}" --help >/dev/null
          done
      # --version never touches SQLite, so boot each binary for real: this is
      # what catches a runtime-specific module that failed to get compiled in.
      - name: Boot test executables
        run: |
          SMOKE_PORT=18201 SMOKE_BIN=build/routstrd bun scripts/smoke/daemon-boot.ts
          SMOKE_PORT=18202 SMOKE_BIN=build-deno/routstrd bun scripts/smoke/daemon-boot.ts
      - name: Package executables
        run: |
          package_version="$(bun -p "require('./package.json').version")"
          tar -C build -czf \
            "routstrd-v${package_version}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" \
            routstrd
          tar -C build-deno -czf \
            "routstrd-v${package_version}-${{ matrix.platform }}-${{ matrix.arch }}-deno.tar.gz" \
            routstrd
      - uses: actions/upload-artifact@v4
        with:
          name: routstrd-${{ matrix.platform }}-${{ matrix.arch }}
          path: routstrd-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: routstrd-*
          merge-multiple: true
      - name: Create checksums
        run: shasum -a 256 routstrd-*.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          routstrd-*.tar.gz SHA256SUMS
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
